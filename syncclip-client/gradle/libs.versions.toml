# ============================================================================
# SyncClip — Gradle Version Catalog
# https://docs.gradle.org/current/userguide/platforms.html#tab:version-catalog-toml
# ============================================================================

[versions]
# Kotlin
kotlin = "2.4.21"
kotlinCoroutines = "1.11.0"

# Android Gradle Plugin
agp = "9.5.2"

# Compose Multiplatform
compose = "1.12.2"
composeCompiler = "1.12.2"
composeRuntime = "1.12.2"
composeMaterial3 = "1.12.0-alpha03"
composeMaterial3Adaptive = "1.3.0"
composeHotReload = "1.3.0"

# Koin (DI)
koin = "4.2.2"

# Ktor
ktor = "3.6.1"
ktorClient = "3.6.1"
ktorServer = "3.6.1"
ktorClientCio = "3.6.1"
ktorServerNetty = "3.6.1"

# Room KMP
room = "2.8.5"
sqlite = "2.7.1"

# DataStore
datastore = "1.3.0"

# Kache (multiplatform caching)
kache = "1.0.0"

# kotlinx serialization
serialization = "1.13.0"

# kotlinx datetime
datetime = "0.8.0"

# Testing
junit = "5.11.4"
junit4 = "4.13.2"
kotest = "6.2.5"
kotlinxCoroutinesTest = "1.11.0"

# Firebase Admin (server)
firebaseAdmin = "9.9.0"
jmdns = "3.6.1"
jnativehook = "2.2.2"

# Firebase client (Google Play services / Android + google-services plugin)
firebaseBom = "35.2.0"
googleServicesPlugin = "4.6.0"

# PostgreSQL / Exposed (server)
exposed = "1.6.1"
postgresql = "42.7.7"
hikaricp = "6.3.0"

# Linting
detekt = "2.0.0"
ktlint = "14.2.0"

# Plugins
spotless = "8.12.0"
androidApplication = "9.5.0"
kotlinMultiplatform = "2.4.21"
serializationPlugin = "2.4.21"

# ---- Архитектурный стандарт (добавлено /arch-init) ----
konsist = "0.18.1"
turbine = "1.2.1"
mockk = "1.14.12"
robolectric = "4.18.1"
roborazzi = "1.79.0"
ksp = "2.3.14"

coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
navigation3 = "1.2.2"
coil = "3.6.3"

[libraries]
# Gradle-плагины как библиотеки (нужны build-logic/convention)
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

# ---- Архитектурный стандарт (добавлено /arch-init) ----
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose-desktop = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose-desktop", version.ref = "roborazzi" }

# AndroidX
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Compose BOM (Android)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Compose Multiplatform (commonMain)
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
cmp-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
cmp-material3-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "composeMaterial3Adaptive" }
cmp-components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose" }
cmp-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "compose" }
cmp-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "compose" }
cmp-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
cmp-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "compose" }

# Navigation 3
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

# Koin
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }

# Kache
kache-core = { module = "io.github.slavikjunior.kache:cache-core", version.ref = "kache" }
kache-android = { module = "io.github.slavikjunior.kache:cache-android", version.ref = "kache" }
kache-storage = { module = "io.github.slavikjunior.kache:cache-storage", version.ref = "kache" }
kache-store-room = { module = "io.github.slavikjunior.kache:cache-store-room", version.ref = "kache" }

# Room / DataStore
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktorClient" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktorClient" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktorClient" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktorClient" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktorClient" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktorClient" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktorClient" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktorClient" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktorClient" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktorServer" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktorServer" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktorServer" }

# Images
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# Firebase (клиент; версии пакетов задаёт BOM)
# LAN discovery (Desktop): ADR-003 называет JmDNS реализацией для JVM.
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
jnativehook = { group = "com.github.kwhat", name = "jnativehook", version.ref = "jnativehook" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Kotlin
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }

# Test
# JVM-инструменты модуля :core:architecture-tests; путь модуля задан в settings.gradle.kts.
junit = { group = "junit", name = "junit", version.ref = "junit4" }

[bundles]
architecture-tests = ["konsist", "junit"]

[plugins]
# Android
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Multiplatform
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlinMultiplatform" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-hot-reload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }

# Ktor
ktor-server-plugin = { id = "io.ktor.server.plugin", version.ref = "ktorServer" }
ktor-client-plugin = { id = "io.ktor.client.plugin", version.ref = "ktorClient" }

# Koin
koin-plugin = { id = "org.jetbrains.kotlin.plugin.koin", version.ref = "kotlin" }

# Serialization
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Firebase
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }

# Spotless
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# Detekt
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# ---- Архитектурный стандарт (добавлено /arch-init) ----
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# ============================================================================
# End of libs.versions.toml
# ============================================================================
